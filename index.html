<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Registro de Servicio Técnico</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <div class="container">
      <h1>Registro de Servicio Técnico</h1>
      <form id="formRegistro">
        <!-- Datos del Cliente -->
        <div>
          <label>Nombre del Cliente:</label>
          <input type="text" name="nombre" required />
        </div>
        <div>
          <label>Dirección:</label>
          <input type="text" name="direccion" />
        </div>
        <div>
          <label>Teléfono:</label>
          <input type="text" name="telefono" />
        </div>
        <!-- Selección del dispositivo -->
        <div class="full">
          <label>Tipo de Dispositivo:</label>
          <select id="tipoDispositivo" name="tipoDispositivo" required>
            <option value="">-- Selecciona --</option>
            <option value="laptop">Laptop</option>
            <option value="pc">Computadora de Escritorio</option>
            <option value="impresora">Impresora</option>
            <option value="monitor">Monitor</option>
          </select>
        </div>
        <!-- Marca -->
        <div>
          <label>Marca:</label>
          <input
            list="listaMarcas"
            name="marca"
            id="marcaInput"
            placeholder="Escribe o selecciona"
          />
          <datalist id="listaMarcas"></datalist>
        </div>

        <!-- Modelo -->
        <div>
          <label>Modelo:</label>
          <input
            list="listaModelos"
            name="modelo"
            id="modeloInput"
            placeholder="Selecciona un modelo"
          />
          <datalist id="listaModelos"></datalist>
        </div>

        <!-- Campos específicos Laptop/PC -->
        <div id="camposLaptopPC" class="full hidden">
          <fieldset>
            <legend>Características Laptop/PC</legend>
            <div>
              <div>
                <label>Procesador:</label>
                <input
                  type="text"
                  id="procesador"
                  name="procesador"
                  list="cpuOpciones"
                />
                <datalist id="cpuOpciones"></datalist>
              </div>
              <div>
                <label>Memoria RAM:</label>
                <input type="text" id="ram" name="ram" list="ramOpciones" />
                <datalist id="ramOpciones"></datalist>
              </div>
              <div>
                <label>Disco Duro:</label>
                <input
                  type="text"
                  id="disco"
                  name="disco"
                  list="discoOpciones"
                />
                <datalist id="discoOpciones"></datalist>
              </div>
              <div>
                <label>Pantalla:</label>
                <select id="estadoPantalla" name="estadoPantalla">
                  <option value="Funciona bien">Funciona bien</option>
                  <option value="Con detalles">
                    Con detalles (rayas, manchas, etc.)
                  </option>
                  <option value="Dañada">Dañada / No funciona</option>
                </select>
              </div>

              <div>
                <label>Teclado:</label>
                <select id="estadoTeclado" name="estadoTeclado">
                  <option value="Funciona bien">Funciona bien</option>
                  <option value="Algunas teclas no funcionan">
                    Solo algunas teclas no funcionan
                  </option>
                  <option value="La mayoría no funciona">
                    La mayoría no funciona
                  </option>
                  <option value="No funciona">No funciona</option>
                </select>
              </div>

              <div>
                <label>Mouse/Touchpad:</label>
                <select id="estadoMouse" name="estadoMouse">
                  <option value="Funciona bien">Funciona bien</option>
                  <option value="A veces falla">A veces falla</option>
                  <option value="No funciona">No funciona</option>
                </select>
              </div>
              <div>
                <label>¿Funciona Correctamente?:</label>
                <select name="funciona">
                  <option>Sí</option>
                  <option>No</option>
                </select>
              </div>
              <div>
                <label>¿Enciende el equipo?:</label>
                <select name="enciendeEquipo", id="enciendeEquipo">
                  <option>Sí</option>
                  <option>No</option>
                </select>
              </div>

              <div>
                <label>Contraseña del equipo (si aplica):</label>
                <input
                  type="text"
                  name="contrasenaEquipo"
                  placeholder="Dejar en blanco si no aplica"
                  id = "contrasenaEquipo"
                />
              </div>
            </div>
          </fieldset>
        </div>
        <!-- Campos específicos Impresora -->
        <div id="camposImpresora" class="full hidden">
          <fieldset
            style="
              border: 2px solid #3f87a6;
              border-radius: 10px;
              padding: 15px;
            "
          >
            <legend style="color: #3f87a6; font-weight: bold">
              Características Impresora
            </legend>
            <div
              style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px"
            >
              <div>
                <label>Tipo de Impresora:</label>
                <select name="tipoImpresora">
                  <option>Inyección de tinta</option>
                  <option>Láser</option>
                  <option>Multifuncional</option>
                </select>
              </div>
              <div>
                <label>¿Imprime correctamente?</label>
                <select name="imprime">
                  <option>Sí</option>
                  <option>No</option>
                </select>
              </div>
              <div class="full">
                <label>Condiciones físicas:</label>
                <textarea name="condicionesImpresora"></textarea>
              </div>
            </div>
          </fieldset>
        </div>
        <!-- Campos específicos Monitor -->
        <div id="camposMonitor" class="full hidden">
          <fieldset
            style="
              border: 2px solid #3f87a6;
              border-radius: 10px;
              padding: 15px;
            "
          >
            <legend style="color: #3f87a6; font-weight: bold">
              Características Monitor
            </legend>
            <div
              style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px"
            >
              <div>
                <label>Tamaño (pulgadas):</label>
                <input type="text" name="tamanoMonitor" />
              </div>
              <div>
                <label>¿Colores correctos?:</label>
                <select name="colores">
                  <option>Sí</option>
                  <option>No</option>
                </select>
              </div>
              <div class="full">
                <label>Condiciones físicas:</label>
                <textarea name="condicionesMonitor"></textarea>
              </div>
            </div>
          </fieldset>
        </div>
        <!-- Otros -->
        <div class="full">
          <label>Trabajo a Realizar:</label>
          <textarea name="trabajo"></textarea>
        </div>
        <div class="full costo-row" style="justify-content: flex-start">
          <label for="costo" style="margin-right: 12px">Costo Estimado:</label>
          <input
            type="number"
            name="costo"
            id="costo"
            min="0"
            step="0.01"
            style="width: 120px; margin-right: 18px"
          />
          <input type="checkbox" id="precioDespues" style="margin-right: 6px" />
          <label for="precioDespues" style="margin-bottom: 0"
            >Precio se da después del mantenimiento</label
          >
        </div>
        <button type="submit">Guardar Registro y Generar PDF</button>
      </form>
    </div>

    <script src="main.js"></script>
  </body>
</html>
